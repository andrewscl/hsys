server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA (rutas internas)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> Gateway
    location /api/ {

# 1. Definimos el resolver (DNS interno de Docker) PRIMERO
        resolver 127.0.0.11 valid=30s;

        # 2. Usamos la variable para que Nginx no valide el host al arrancar
        set $target http://hsys-gateway:8080;
        proxy_pass $target;

        # 3. Configuraciones de timeout y headers
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }
}