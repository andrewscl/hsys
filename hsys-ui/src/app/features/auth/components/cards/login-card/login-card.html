<div class="auth-card">

  <button class="auth-card__close" (click)="goBack()" aria-label="Volver">
    <i class="fas fa-times"></i>
  </button>

  <div class="auth-card__header">
    <h3>Acceso Clientes</h3>
  </div>
  
  <form class="auth-card__form" [formGroup]="loginForm"
                              (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" formControlName="username" placeholder="Ingrese su usuario">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" formControlName="password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn-auth" [disabled]="loginForm.invalid">
      Iniciar Sesión
    </button>
  </form>

</div>
